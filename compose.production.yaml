services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: littletab
      POSTGRES_USER: littletab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littletab"]
      interval: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://littletab:${POSTGRES_PASSWORD}@db:5432/littletab
    ports:
      - "127.0.0.1:8080:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
